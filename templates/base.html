<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pursuit{% endblock %} | Pursuit</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block head %}{% endblock %}
</head>

<body>

    <header class="site-header">
        <a href="{{ url_for('dashboard') }}" class="brand">
            pursuit<span>.</span>
        </a>

        <nav class="main-nav">
            <a href="{{ url_for('dashboard') }}#features">Features</a>
            <a href="{{ url_for('companies') }}">Companies</a>
            <a href="{{ url_for('jobs') }}">Jobs</a>
            <a href="{{ url_for('applications') }}">Applications</a>
            <a href="{{ url_for('contacts') }}">Contacts</a>
            <a href="{{ url_for('job_match') }}">Job Match</a>
        </nav>

        <a href="{{ url_for('applications') }}" class="nav-cta">
            Open Tracker <span>↗</span>
        </a>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <a href="{{ url_for('dashboard') }}" class="brand">
            pursuit<span>.</span>
        </a>
        <p>A more intentional way to navigate your career.</p>
        <span class="footer-copy">© 2026 Pursuit</span>
    </footer>

    {% block scripts %}{% endblock %}

</body>

</html>
